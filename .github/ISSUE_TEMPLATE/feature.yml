# .github/ISSUE_TEMPLATE/feature.yml
name: ✨ Feature Request
description: Propose a new feature for java-fawkes-path
title: "[Feature]: "
# Only labels that already exist in this repo are listed; "area:unknown"
# (used by uFawkesDevX's template) does not exist here.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Summary & Motivation
        Briefly describe the feature and why it's needed.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or implementation approach.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Application code (src/main/java)
        - Tests (src/test/java)
        - Build (pom.xml / Maven)
        - CI / pipeline contract (.fawkespipe.yml, .woodpecker.yml)
        - Container (Dockerfile)
        - Documentation (README, docs/)
      validations:
        required: true

  - type: checkboxes
    id: copilot
    attributes:
      label: Copilot Readiness
      options:
        - label: Ready for Copilot agent (clear scope, tests defined)
          required: false
